<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-50 to-purple-100 py-12 px-4">
  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-2xl">
    <h2 class="text-3xl font-bold text-center text-gray-900 mb-8">Đăng nhập</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Tên đăng nhập</label>
        <input type="text" formControlName="username" 
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
               placeholder="Nhập tên đăng nhập">
        <p *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" 
           class="mt-1 text-sm text-red-600">Vui lòng nhập tên đăng nhập</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
        <input type="password" formControlName="password"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
               placeholder="Nhập mật khẩu">
        <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
           class="mt-1 text-sm text-red-600">Mật khẩu phải có ít nhất 6 ký tự</p>
      </div>

      <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading || loginForm.invalid"
              class="w-full bg-orange-500 text-white py-3 rounded-lg font-semibold hover:bg-orange-600 disabled:opacity-50 disabled:cursor-not-allowed transition">
        <span *ngIf="!loading">Đăng nhập</span>
        <span *ngIf="loading">Đang xử lý...</span>
      </button>

      <p class="text-center text-sm text-gray-600">
        Chưa có tài khoản? 
        <a routerLink="/register" class="text-orange-500 hover:text-orange-600 font-medium">Đăng ký ngay</a>
      </p>
    </form>
  </div>
</div>
