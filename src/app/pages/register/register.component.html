<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-purple-50 to-pink-100 py-12 px-4">
  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-2xl">
    <h2 class="text-3xl font-bold text-center text-gray-900 mb-8">Đăng ký tài khoản</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập *</label>
        <input type="text" formControlName="username" 
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
               placeholder="Nhập tên đăng nhập">
        <p *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched"
           class="mt-1 text-sm text-red-600">Tên đăng nhập phải có ít nhất 3 ký tự</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
        <input type="email" formControlName="email"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
               placeholder="Nhập email">
        <p *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
           class="mt-1 text-sm text-red-600">Email không hợp lệ</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu *</label>
        <input type="password" formControlName="password"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
               placeholder="Nhập mật khẩu">
        <p *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
           class="mt-1 text-sm text-red-600">Mật khẩu phải có ít nhất 6 ký tự</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Họ tên</label>
        <input type="text" formControlName="fullName"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
               placeholder="Nhập họ tên">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
        <input type="tel" formControlName="phoneNumber"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
               placeholder="Nhập số điện thoại">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Địa chỉ</label>
        <textarea formControlName="address" rows="2"
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                  placeholder="Nhập địa chỉ"></textarea>
      </div>

      <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg">
        {{ successMessage }}
      </div>

      <button type="submit" [disabled]="loading || registerForm.invalid"
              class="w-full bg-orange-600 text-white py-3 rounded-lg font-semibold hover:bg-purple-700 disabled:opacity-50 transition">
        <span *ngIf="!loading">Đăng ký</span>
        <span *ngIf="loading">Đang xử lý...</span>
      </button>

      <p class="text-center text-sm text-gray-600">
        Đã có tài khoản? 
        <a routerLink="/login" class="text-orange-600 hover:text-purple-700 font-medium">Đăng nhập ngay</a>
      </p>
    </form>
  </div>
</div>
